name: CI/CD Pipeline - TaskMate Deployment

on:
  push:
    branches:
      - main
      - feature/docker-cicd
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub Actions

jobs:
  # ========================================================
  # GIAI ĐOẠN 1: CI (Continuous Integration - Kiểm tra mã nguồn)
  # ========================================================
  ci:
    name: Build & Test (FE & BE)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ----------------- FRONTEND CHECK -----------------
      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: 🔍 Run ESLint on Frontend
        run: |
          cd frontend
          npm run lint

      - name: 🏗️ Build Frontend for Production
        run: |
          cd frontend
          npm run build

      # ----------------- BACKEND CHECK -----------------
      - name: 🟣 Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore Backend dependencies
        run: |
          dotnet restore backend/smart-marketplace-new.csproj

      - name: 🏗️ Build Backend Web API
        run: |
          dotnet build backend/smart-marketplace-new.csproj --no-restore -c Release

      - name: 🧪 Run Backend Unit Tests
        run: |
          dotnet test smart-marketplace-new.Tests/smart-marketplace-new.Tests.csproj -c Release --verbosity normal

  # ========================================================
  # GIAI ĐOẠN 2: CD (Continuous Deployment - Triển khai lên VPS)
  # ========================================================
  cd:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/docker-cicd'

    steps:
      - name: 🚀 Kết nối SSH và cập nhật hệ thống trên VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 [CI/CD] Bắt đầu quy trình tự động cập nhật..."

            # Thư mục dự án trên VPS (mặc định /var/www/smart-marketplace hoặc qua Secret)
            TARGET_DIR="${{ secrets.VPS_APP_DIR || '/var/www/smart-marketplace' }}"
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Thư mục $TARGET_DIR không tồn tại trên VPS! Vui lòng clone dự án về thư mục này trước."
              exit 1
            fi

            cd "$TARGET_DIR"

            echo "📥 [1/3] Kéo code mới nhất từ nhánh ${{ github.ref_name }}..."
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}

            echo "🐳 [2/3] Build lại và khởi chạy các Docker Container..."
            docker compose up -d --build

            echo "🧹 [3/3] Dọn dẹp các Docker image cũ để tiết kiệm dung lượng đĩa VPS..."
            docker image prune -f

            echo "🎉 [CI/CD] Hệ thống đã được cập nhật phiên bản mới nhất thành công!"
