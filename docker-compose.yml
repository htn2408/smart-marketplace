services:
  # ========================================================
  # 1. Cơ sở dữ liệu MySQL 8.0 (Quan hệ: Users, Tasks,...)
  # ========================================================
  mysql:
    image: mysql:8.0
    container_name: smart-marketplace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345678}
      MYSQL_DATABASE: ${DB_NAME:-smart_marketplace}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_PASSWORD:-12345678} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - taskmate-network

  # ========================================================
  # 2. Cơ sở dữ liệu MongoDB 7.0 (NoSQL: Real-time Chat)
  # ========================================================
  mongodb:
    image: mongo:7.0
    container_name: smart-marketplace-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - taskmate-network

  # ========================================================
  # 3. Backend Web API (.NET 10 Core)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-marketplace-be:latest
    container_name: smart-marketplace-api
    restart: unless-stopped
    ports:
      - "5236:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:8080"

      # Kết nối MySQL qua tên container 'mysql'
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${DB_NAME:-smart_marketplace};User=${DB_USER:-root};Password=${DB_PASSWORD:-12345678};"

      # Kết nối MongoDB qua tên container 'mongodb'
      MONGODB_CONNECTION_STRING: "mongodb://mongodb:27017"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-message-management}"

      # JWT Secret
      Jwt__Key: "${Jwt__Key:-dev-only-secret-key-change-me-0123456789}"
      Jwt__Issuer: "${Jwt__Issuer:-smart-marketplace}"
      Jwt__Audience: "${Jwt__Audience:-smart-marketplace}"
      Jwt__ExpiresMinutes: "${Jwt__ExpiresMinutes:-1440}"
      JWT_SECRET: "${JWT_SECRET:-dev-only-secret-key-change-me-0123456789}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-24h}"

      # CORS
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}"

      # Cloudinary Upload
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-}"

      # SMTP Email
      EmailSettings__SmtpServer: "${EmailSettings__SmtpServer:-smtp.gmail.com}"
      EmailSettings__Port: "${EmailSettings__Port:-587}"
      EmailSettings__SenderEmail: "${EmailSettings__SenderEmail:-}"
      EmailSettings__SenderName: "${EmailSettings__SenderName:-TaskMate Support}"
      EmailSettings__Password: "${EmailSettings__Password:-}"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - taskmate-network

  # ========================================================
  # 4. Frontend Web App (React SPA + Nginx)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:5236/api}"
        VITE_CHAT_HUB_URL: "${VITE_CHAT_HUB_URL:-http://localhost:5236/hubs/chat}"
    image: smart-marketplace-fe:latest
    container_name: smart-marketplace-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "5173:80"
    volumes:
      - ${SSL_CERTS_PATH:-./certs_empty}:/etc/letsencrypt:ro
      - ${NGINX_CONF_PATH:-./frontend/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${CERTBOT_WWW_PATH:-./certs_empty}:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - taskmate-network

# ========================================================
# Cấu hình lưu trữ dữ liệu vĩnh viễn (Volumes)
# ========================================================
volumes:
  mysql_data:
  mongo_data:

# ========================================================
# Mạng nội bộ kết nối an toàn giữa các container
# ========================================================
networks:
  taskmate-network:
    driver: bridge
